<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CRM{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>

    <div class="container mt-3 position-absolute start-50 translate-middle-x" style="z-index: 1050; width: 80%; max-width: 600px;">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %} alert-dismissible fade show shadow" role="alert">
                    
                    {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill me-2"></i>{% endif %}
                    {% if message.tags == 'error' %}<i class="bi bi-x-circle-fill me-2"></i>{% endif %}
                    {% if message.tags == 'warning' %}<i class="bi bi-exclamation-triangle-fill me-2"></i>{% endif %}
                    {% if message.tags == 'info' %}<i class="bi bi-info-circle-fill me-2"></i>{% endif %}
                    
                    <strong>{{ message }}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    {% block body %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Seleccionamos solo las alertas de éxito, información y advertencia.
            // Las alertas rojas (.alert-danger) quedan fuera de esta lista.
            const alertas = document.querySelectorAll('.alert-success, .alert-info, .alert-warning');
            
            alertas.forEach(function(alerta) {
                // Configuramos un temporizador de 4000 milisegundos (4 segundos)
                setTimeout(function() {
                    // Usamos la API oficial de Bootstrap para cerrarla con su animación nativa
                    const bsAlert = bootstrap.Alert.getOrCreateInstance(alerta);
                    bsAlert.close();
                }, 4000);
            });
        });
    </script>
</body>
</html>
